# /etc/nginx/sites-available/3s-saree
# Symlink to sites-enabled after filling in your domain.
#
# Replace YOUR_DOMAIN with your actual domain (e.g. 3ssaree.com).
# After placing this file, run:
#   sudo ln -s /etc/nginx/sites-available/3s-saree /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN

server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Certbot will add the HTTPS redirect and SSL blocks automatically.

    client_max_body_size 100M;

    # Uploaded images — served directly by nginx, bypassing Node
    location /uploads/ {
        alias /opt/3s-saree/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API and everything else → Node.js
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
